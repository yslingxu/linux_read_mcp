[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "linux-read-mcp"
version = "0.1.0"
description = "Linux read-only MCP Server for remote troubleshooting"
authors = [{name = "Your Name", email = "your.email@example.com"}]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0.0",
    "psutil>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
linux-read-mcp = "linux_read_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/linux_read_mcp"]
